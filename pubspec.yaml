name: job_circular_aggregator
description: "জব সার্কুলার এগ্রিগেটর — সব চাকরির খোঁজ এক জায়গায়, আবেদন ট্র্যাকিং ও বিজ্ঞপ্তি।"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Persists the bn/en language choice (a per-device UI preference, not
  # data — deliberately not synced/backed up like everything else).
  shared_preferences: ^2.3.2

  uuid: ^4.4.2

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1

  # Previewing a job site an admin adds, before the scraper uses it.
  http: ^1.6.0
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.3.0

flutter_launcher_icons:
  android: true
  ios: false # this project has no ios/ platform directory
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground art is already sized to the adaptive-icon safe zone.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/fonts/NotoSansBengali-Regular.ttf
    - assets/fonts/NotoSansBengali-Bold.ttf

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
