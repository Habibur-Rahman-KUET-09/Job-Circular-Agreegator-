name: Scrape jobs

on:
  schedule:
    - cron: "0 0 * * *" # 06:00 Asia/Dhaka
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest = save to Firestore, dry-run = print only, inspect = debug page structure"
        type: choice
        options: [ingest, dry-run, inspect]
        default: ingest

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

      - name: Run scrapers
        env:
          MODE: ${{ inputs.mode || 'ingest' }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          if [ "$MODE" = "ingest" ]; then
            if [ -z "$FIREBASE_CREDENTIALS" ]; then
              echo "::error::Add the service-account JSON as the FIREBASE_CREDENTIALS repository secret."
              exit 1
            fi
            printf '%s' "$FIREBASE_CREDENTIALS" > "$RUNNER_TEMP/firebase-credentials.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-credentials.json"
          fi
          python run_scrapers.py --mode "$MODE"
